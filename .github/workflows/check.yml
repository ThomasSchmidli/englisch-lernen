name: Prüfen
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: for f in js/*.js sw.js scripts/*.js; do node --check "$f"; done
      - name: Inhalte und Offline-Dateien
        run: node scripts/check.js
      - name: Tests der Logik
        run: node scripts/test.js
